apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          # Replace with the same image you built/ran on EC2, e.g.:
          #   myapp:latest             (if loaded locally into minikube/kind)
          #   <dockerhub-user>/myapp:latest  (if pushed to a registry)
          image: myapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000   # change to whatever port your app listens on
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
