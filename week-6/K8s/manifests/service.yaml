apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  labels:
    app: myapp
spec:
  type: NodePort
  selector:
    app: myapp        # must match the Deployment's pod labels
  ports:
    - port: 80          # port the Service exposes inside the cluster
      targetPort: 3000  # must match containerPort in deployment.yaml
      nodePort: 30080    # optional; 30000-32767. Let k8s pick one by omitting this line.
      protocol: TCP
