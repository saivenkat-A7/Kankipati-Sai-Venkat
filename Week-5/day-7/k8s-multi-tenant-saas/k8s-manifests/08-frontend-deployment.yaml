# Frontend Deployment: runs your React/Vue/Angular app (usually served via Nginx).
# >>> EDIT the "image:" line below to your actual frontend image <<<
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: saas-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB_USERNAME/saas-frontend:v1   # <-- CHANGE THIS
          ports:
            - containerPort: 80     # <-- 80 is typical if served by Nginx
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
