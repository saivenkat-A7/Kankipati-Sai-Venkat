# Ingress = one clean entry-point (like a receptionist) that routes traffic:
#   yourapp.local/        -> frontend
#   yourapp.local/api      -> backend
# Requires an Ingress Controller installed first (see day-guides/day4).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-ingress
  namespace: saas-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: saas.local          # add "127.0.0.1 saas.local" to your /etc/hosts to test locally
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
